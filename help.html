<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>STARFANG - Help</title>
  <style>
    :root {
      --bg: #060b17;
      --bg2: #0a1428;
      --line: #53f7ff;
      --text: #d8f5ff;
      --muted: #9cc4d6;
      --warn: #ffd166;
      --bad: #ff8d95;
      --ok: #91ffb4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Lucida Sans Unicode", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(83, 247, 255, 0.09), transparent 32%),
        radial-gradient(circle at 82% 72%, rgba(255, 209, 102, 0.08), transparent 26%),
        linear-gradient(180deg, var(--bg2), var(--bg));
    }
    .wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 20px 16px 36px;
    }
    .top {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .back {
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(83, 247, 255, 0.45);
      padding: 7px 11px;
      background: rgba(6, 10, 18, 0.7);
    }
    .hint {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.45;
    }
    .section {
      margin-top: 16px;
    }
    .section h2 {
      margin: 0 0 10px;
      font-size: 1.02rem;
      color: #b9ffc8;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }
    .card {
      border: 1px solid rgba(83, 247, 255, 0.4);
      background: linear-gradient(180deg, rgba(7, 13, 23, 0.86), rgba(6, 10, 18, 0.8));
      padding: 10px;
      min-height: 166px;
    }
    .head {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .icon {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(83, 247, 255, 0.5);
      display: grid;
      place-items: center;
      background: rgba(10, 22, 36, 0.85);
    }
    .glyph {
      width: 30px;
      height: 30px;
      display: block;
    }
    .g-stroke {
      fill: none;
      stroke: #9fe8ff;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .g-fill {
      fill: rgba(140, 215, 255, 0.2);
      stroke: #a6ecff;
      stroke-width: 1.2;
    }
    .g-hot {
      fill: rgba(255, 145, 112, 0.32);
      stroke: #ffc58a;
      stroke-width: 1.2;
    }
    .g-ufo {
      fill: rgba(223, 122, 255, 0.3);
      stroke: #f0c1ff;
      stroke-width: 1.3;
    }
    .g-hazard {
      fill: rgba(132, 174, 255, 0.16);
      stroke: rgba(164, 206, 255, 0.9);
      stroke-width: 1.2;
    }
    .name {
      margin: 0;
      font-size: 0.97rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .tag {
      color: var(--warn);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .line {
      margin: 7px 0 0;
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.38;
    }
    .impact {
      margin-top: 8px;
      font-size: 0.84rem;
      line-height: 1.34;
      border-top: 1px solid rgba(83, 247, 255, 0.22);
      padding-top: 7px;
      color: #cdefff;
    }
    .impact strong { color: var(--text); }
    .bad { color: var(--bad); }
    .ok { color: var(--ok); }
    .small-hint {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.4;
    }
    .weapon-card {
      min-height: 230px;
    }
    .identity-card {
      min-height: 200px;
    }
    .ship-preview {
      width: 100%;
      height: 74px;
      border: 1px solid rgba(83, 247, 255, 0.32);
      background: linear-gradient(180deg, rgba(7, 13, 23, 0.9), rgba(5, 9, 16, 0.92));
      margin: 8px 0;
      display: grid;
      place-items: center;
    }
    .ship-glyph {
      width: 110px;
      height: 58px;
      display: block;
    }
    .ship-stroke {
      fill: none;
      stroke: #bdeeff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ship-fill {
      fill: rgba(166, 232, 255, 0.18);
      stroke: rgba(190, 240, 255, 0.96);
      stroke-width: 1.4;
    }
    .ship-core {
      fill: rgba(220, 245, 255, 0.74);
    }
    .weapon-preview {
      width: 100%;
      height: 64px;
      border: 1px solid rgba(83, 247, 255, 0.32);
      background: linear-gradient(180deg, rgba(7, 13, 23, 0.9), rgba(5, 9, 16, 0.92));
      margin: 6px 0 8px;
      display: block;
    }
    .stats {
      margin: 4px 0 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px 8px;
      font-size: 0.78rem;
      color: #ccefff;
    }
    .stat {
      border-top: 1px solid rgba(83, 247, 255, 0.18);
      padding-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat b {
      color: #a7f3ff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1 data-i18n="help.page_title">STARFANG - Object Help</h1>
      <a class="back" href="./index.html" data-i18n="help.back_to_game">Back to game</a>
    </div>
    <p class="hint" data-i18n="help.page_hint">
      Quick overview of what you see on screen. Each card includes icon, name, behavior, and gameplay impact.
    </p>

    <div id="helpSections"></div>
  </main>

  <script src="./js/version.js"></script>
  <script src="./js/content-data.js"></script>
  <script src="./js/balance-data.js"></script>
  <script src="./js/balance-presets.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/i18n.js"></script>
  <script>
    (() => {
      if (window.Asteroids?.i18n) window.Asteroids.i18n.applyTranslations(document);
      const tr = (key, params = {}) => (typeof window.Asteroids?.t === "function" ? window.Asteroids.t(key, params) : key);
      const setRichText = (node, value) => {
        if (!node) return;
        if (typeof window.Asteroids?.i18n?.setRichText === "function") {
          window.Asteroids.i18n.setRichText(node, value);
          return;
        }
        node.textContent = String(value ?? "");
      };
      document.title = tr("help.document_title");

      const cfg = window.Asteroids?.GAME_CONFIG;
      const asteroidTypes = window.Asteroids?.ASTEROID_TYPES || {};
      const root = document.getElementById("helpSections");
      if (!cfg || !root) return;

      const hasTranslation = (key) => tr(key) !== key;

      const iconSvg = (iconKey) => {
        const map = {
          shared_pool: '<svg viewBox="0 0 32 32" class="glyph"><circle class="g-hazard" cx="16" cy="16" r="10"/><path class="g-stroke" d="M16 6 L16 26 M6 16 L26 16"/></svg>',
          drain_factors: '<svg viewBox="0 0 32 32" class="glyph"><path d="M7 22 L25 22" class="g-stroke"/><path d="M9 18 L15 10 L21 18" class="g-stroke"/></svg>',
          mission: '<svg viewBox="0 0 32 32" class="glyph"><circle class="g-stroke" cx="16" cy="16" r="10"/><path class="g-stroke" d="M16 9 L16 16 L21 19"/></svg>',
          asteroid: '<svg viewBox="0 0 32 32" class="glyph"><path class="g-fill" d="M8 8 L16 5 L24 10 L26 18 L19 25 L10 23 L6 15 Z"/></svg>',
          biome: '<svg viewBox="0 0 32 32" class="glyph"><circle class="g-hazard" cx="16" cy="16" r="10"/><path class="g-stroke" d="M8 12 L24 12 M8 20 L24 20"/></svg>',
          pilot: '<svg viewBox="0 0 32 32" class="glyph"><path class="g-stroke" d="M8 24 L8 8 L24 8"/><path class="g-stroke" d="M10 20 L15 15 L19 17 L24 10"/></svg>',
          ship: '<svg viewBox="0 0 32 32" class="glyph"><path class="g-fill" d="M16 5 L24 23 L16 19 L8 23 Z"/><path class="g-stroke" d="M16 5 L16 19"/></svg>',
          salvage: '<svg viewBox="0 0 32 32" class="glyph"><path class="g-stroke" d="M7 20 L15 12 L20 17 L12 25 Z"/><path class="g-stroke" d="M19 9 L23 13"/><circle class="g-hazard" cx="23.5" cy="8.5" r="2.2"/></svg>',
          ufo: '<svg viewBox="0 0 32 32" class="glyph"><ellipse class="g-ufo" cx="16" cy="18" rx="10.5" ry="5.2"/></svg>',
          hazard: '<svg viewBox="0 0 32 32" class="glyph"><circle class="g-hazard" cx="16" cy="16" r="10"/><path class="g-stroke" d="M8 16 L24 16 M16 8 L16 24"/></svg>',
          dev: '<svg viewBox="0 0 32 32" class="glyph"><path class="g-stroke" d="M6 26 L6 8 L26 8"/><path class="g-stroke" d="M9 21 L13 17 L17 18 L23 12"/></svg>'
        };
        return map[iconKey] || map.asteroid;
      };

      const cardIconByKey = {
        shared_pool: "shared_pool",
        salvage_loop: "salvage",
        drain_factors: "drain_factors",
        flight_models: "ship",
        difficulty_presets: "mission",
        mutator_presets: "mission",
        mission_survive: "mission",
        mission_ufo_hunt: "mission",
        mission_asteroid_storm: "mission",
        mission_mini_boss: "mission",
        boss_rush_mode: "mission",
        biome_belt_fringe: "biome",
        biome_wreck_graveyard: "biome",
        biome_refinery: "biome",
        biome_ion_field: "biome",
        biome_shattered_relay: "biome",
        biome_cryo_ring: "biome",
        pilot_xp: "pilot",
        pilot_attributes: "pilot",
        pilot_perk_unlock: "pilot",
        identity_pilots: "pilot",
        identity_references: "pilot",
        identity_ships: "ship",
        asteroid_normal: "asteroid",
        asteroid_magnetic: "asteroid",
        asteroid_volatile: "asteroid",
        ufo_hunter: "ufo",
        ufo_sniper: "ufo",
        ufo_swarm: "ufo",
        ufo_kamikaze: "ufo",
        ufo_support: "ufo",
        ufo_mine_layer: "ufo",
        hazard_debris_field: "hazard",
        hazard_plasma_vent: "hazard",
        hazard_gravity_anomaly: "hazard",
        hazard_ion_storm: "hazard",
        hazard_relay_jammer_burst: "hazard",
        hazard_cryo_shear_zone: "hazard"
      };

      const appendCard = (grid, cardKey) => {
        const nameKey = `help.card.${cardKey}.name`;
        if (!hasTranslation(nameKey)) return;
        const card = document.createElement("article");
        card.className = "card";

        const head = document.createElement("div");
        head.className = "head";
        const icon = cardIconByKey[cardKey] || "asteroid";
        const iconNode = document.createElement("div");
        iconNode.className = "icon";
        iconNode.innerHTML = iconSvg(icon);
        const titleWrap = document.createElement("div");
        const name = document.createElement("p");
        name.className = "name";
        name.textContent = tr(nameKey);
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = tr(`help.card.${cardKey}.tag`);
        titleWrap.appendChild(name);
        titleWrap.appendChild(tag);
        head.appendChild(iconNode);
        head.appendChild(titleWrap);

        const line = document.createElement("p");
        line.className = "line";
        setRichText(line, tr(`help.card.${cardKey}.line`));

        const impact = document.createElement("p");
        impact.className = "impact";
        setRichText(impact, tr(`help.card.${cardKey}.impact`));

        card.appendChild(head);
        card.appendChild(line);
        card.appendChild(impact);
        grid.appendChild(card);
      };

      const appendSection = (opts) => {
        const section = document.createElement("section");
        section.className = "section";

        const title = document.createElement("h2");
        title.textContent = tr(opts.titleKey);
        section.appendChild(title);

        if (opts.hintKey) {
          const hint = document.createElement("p");
          hint.className = "small-hint";
          if (opts.hintHtml) setRichText(hint, tr(opts.hintKey));
          else hint.textContent = tr(opts.hintKey);
          section.appendChild(hint);
        }

        if (Array.isArray(opts.extraHints)) {
          for (const extra of opts.extraHints) {
            const hint = document.createElement("p");
            hint.className = "small-hint";
            if (extra.html) setRichText(hint, tr(extra.key));
            else hint.textContent = tr(extra.key);
            section.appendChild(hint);
          }
        }

        if (Array.isArray(opts.cards) && opts.cards.length > 0) {
          const grid = document.createElement("div");
          grid.className = "grid";
          for (const cardKey of opts.cards) appendCard(grid, cardKey);
          section.appendChild(grid);
        }

        root.appendChild(section);
        return section;
      };

      const toMissionCard = (type) => {
        if (type === "ufo_hunt") return "mission_ufo_hunt";
        if (type === "asteroid_storm") return "mission_asteroid_storm";
        if (type === "mini_boss") return "mission_mini_boss";
        return "mission_survive";
      };

      const biomeCardById = {
        belt: "biome_belt_fringe",
        graveyard: "biome_wreck_graveyard",
        refinery: "biome_refinery",
        ion_field: "biome_ion_field",
        shattered_relay: "biome_shattered_relay",
        cryo_ring: "biome_cryo_ring"
      };

      const hazardCardBySource = {
        debris_field: "hazard_debris_field",
        plasma_vent: "hazard_plasma_vent",
        gravity_anomaly: "hazard_gravity_anomaly",
        ion_storm: "hazard_ion_storm",
        relay_jammer_burst: "hazard_relay_jammer_burst",
        cryo_shear_zone: "hazard_cryo_shear_zone"
      };

      const shipFrameSvg = (shipId) => {
        const map = {
          viper_mk2:
            '<svg viewBox="0 0 120 60" class="ship-glyph"><path class="ship-fill" d="M60 5 L78 36 L60 31 L42 36 Z"/><path class="ship-stroke" d="M60 5 L60 31"/><path class="ship-stroke" d="M48 34 L36 47 M72 34 L84 47"/><circle class="ship-core" cx="60" cy="24" r="2.1"/></svg>',
          bastion_frame:
            '<svg viewBox="0 0 120 60" class="ship-glyph"><path class="ship-fill" d="M60 6 L82 28 L74 52 L46 52 L38 28 Z"/><path class="ship-stroke" d="M46 42 L74 42"/><path class="ship-stroke" d="M60 6 L60 34"/><circle class="ship-core" cx="60" cy="24" r="2.2"/></svg>',
          revenant_frame:
            '<svg viewBox="0 0 120 60" class="ship-glyph"><path class="ship-fill" d="M60 4 L86 34 L60 44 L34 34 Z"/><path class="ship-stroke" d="M34 34 L23 46 M86 34 L97 46"/><path class="ship-stroke" d="M52 31 L60 18 L68 31"/><circle class="ship-core" cx="60" cy="28" r="2.2"/></svg>',
          helix_frame:
            '<svg viewBox="0 0 120 60" class="ship-glyph"><path class="ship-fill" d="M60 6 L78 20 L84 40 L60 53 L36 40 L42 20 Z"/><path class="ship-stroke" d="M42 20 L78 40"/><path class="ship-stroke" d="M78 20 L42 40"/><circle class="ship-core" cx="60" cy="29" r="2.2"/></svg>'
        };
        return map[shipId] || map.viper_mk2;
      };

      const modifierLabel = {
        maxSpeedPct: "max speed",
        hullPct: "hull",
        shieldPct: "shield",
        thrustPct: "thrust",
        primaryDamagePct: "primary dmg",
        heatDissipationPct: "heat dissipation",
        energyRegenPct: "energy regen",
        utilityCooldownPct: "utility cooldown"
      };

      const formatModifierValue = (value) => {
        if (!Number.isFinite(value)) return "0%";
        const pct = Math.round(value * 100);
        return `${pct > 0 ? "+" : ""}${pct}%`;
      };

      const formatModifierLine = (modifiers = {}) => {
        const entries = Object.entries(modifiers)
          .filter(([, value]) => Number.isFinite(value) && value !== 0)
          .map(([key, value]) => `${formatModifierValue(value)} ${modifierLabel[key] || key}`);
        return entries.length ? entries.join(", ") : "-";
      };

      const appendPilotRosterSection = () => {
        const section = appendSection({
          titleKey: "help.section.pilot_roster",
          hintKey: "help.section.pilot_roster_hint"
        });
        const grid = document.createElement("div");
        grid.className = "grid";

        const pilots = cfg.identity?.pilots || [];
        for (const pilot of pilots) {
          const card = document.createElement("article");
          card.className = "card identity-card";

          const head = document.createElement("div");
          head.className = "head";
          const iconNode = document.createElement("div");
          iconNode.className = "icon";
          iconNode.innerHTML = iconSvg("pilot");
          const titleWrap = document.createElement("div");
          const name = document.createElement("p");
          name.className = "name";
          name.textContent = tr(`identity.pilot.${pilot.id}.callsign`);
          const tag = document.createElement("div");
          tag.className = "tag";
          tag.textContent = tr(`identity.pilot.${pilot.id}.reference`);
          titleWrap.appendChild(name);
          titleWrap.appendChild(tag);
          head.appendChild(iconNode);
          head.appendChild(titleWrap);

          const line = document.createElement("p");
          line.className = "line";
          line.textContent = tr(`help.pilot.${pilot.id}.bio`);

          const impact = document.createElement("p");
          impact.className = "impact";
          impact.innerHTML = `<strong>${tr("help.identity.flavor_bonus")}:</strong> ${formatModifierLine(pilot.modifiers || {})}`;

          card.appendChild(head);
          card.appendChild(line);
          card.appendChild(impact);
          grid.appendChild(card);
        }

        section.appendChild(grid);
      };

      const appendShipFrameSection = () => {
        const section = appendSection({
          titleKey: "help.section.ship_frames",
          hintKey: "help.section.ship_frames_hint"
        });
        const grid = document.createElement("div");
        grid.className = "grid";

        const ships = cfg.identity?.ships || [];
        for (const ship of ships) {
          const card = document.createElement("article");
          card.className = "card identity-card";

          const head = document.createElement("div");
          head.className = "head";
          const iconNode = document.createElement("div");
          iconNode.className = "icon";
          iconNode.innerHTML = iconSvg("ship");
          const titleWrap = document.createElement("div");
          const name = document.createElement("p");
          name.className = "name";
          name.textContent = tr(`identity.ship.${ship.id}.name`);
          const tag = document.createElement("div");
          tag.className = "tag";
          tag.textContent = tr("help.identity.ship_tag");
          titleWrap.appendChild(name);
          titleWrap.appendChild(tag);
          head.appendChild(iconNode);
          head.appendChild(titleWrap);

          const preview = document.createElement("div");
          preview.className = "ship-preview";
          preview.innerHTML = shipFrameSvg(ship.id);

          const line = document.createElement("p");
          line.className = "line";
          line.textContent = tr(`help.ship.${ship.id}.bio`);

          const impact = document.createElement("p");
          impact.className = "impact";
          impact.innerHTML = `<strong>${tr("help.identity.flavor_bonus")}:</strong> ${formatModifierLine(ship.modifiers || {})}`;

          card.appendChild(head);
          card.appendChild(preview);
          card.appendChild(line);
          card.appendChild(impact);
          grid.appendChild(card);
        }

        section.appendChild(grid);
      };

      const appendPilotAttributeReferenceSection = () => {
        const section = appendSection({
          titleKey: "help.section.pilot_attributes_ref",
          hintKey: "help.section.pilot_attributes_ref_hint"
        });
        const grid = document.createElement("div");
        grid.className = "grid";
        const order = ["reflex", "systems", "grit", "instinct"];
        for (const key of order) {
          const card = document.createElement("article");
          card.className = "card identity-card";
          const head = document.createElement("div");
          head.className = "head";
          const iconNode = document.createElement("div");
          iconNode.className = "icon";
          iconNode.innerHTML = iconSvg("pilot");
          const titleWrap = document.createElement("div");
          const name = document.createElement("p");
          name.className = "name";
          name.textContent = tr(`pilot.attribute.${key}.name`);
          const tag = document.createElement("div");
          tag.className = "tag";
          const cap = Math.max(1, Math.floor(cfg.pilot?.attributeCaps?.[key] || 25));
          tag.textContent = `Cap ${cap}`;
          titleWrap.appendChild(name);
          titleWrap.appendChild(tag);
          head.appendChild(iconNode);
          head.appendChild(titleWrap);
          const line = document.createElement("p");
          line.className = "line";
          line.textContent = tr(`pilot.attribute.${key}.desc`);
          const impact = document.createElement("p");
          impact.className = "impact";
          impact.innerHTML = `<strong>Level impact:</strong> ${tr(`pilot.attribute.${key}.effect`)}`;
          card.appendChild(head);
          card.appendChild(line);
          card.appendChild(impact);
          grid.appendChild(card);
        }
        section.appendChild(grid);
      };

      const appendPilotPerkReferenceSection = () => {
        const section = appendSection({
          titleKey: "help.section.pilot_perks_ref",
          hintKey: "help.section.pilot_perks_ref_hint"
        });
        const grid = document.createElement("div");
        grid.className = "grid";
        const perks = cfg.pilot?.perks || [];
        for (const perk of perks) {
          const card = document.createElement("article");
          card.className = "card identity-card";
          const head = document.createElement("div");
          head.className = "head";
          const iconNode = document.createElement("div");
          iconNode.className = "icon";
          iconNode.innerHTML = iconSvg("pilot");
          const titleWrap = document.createElement("div");
          const name = document.createElement("p");
          name.className = "name";
          name.textContent = `${perk.label} (${String(perk.branch || "").toUpperCase()})`;
          const tag = document.createElement("div");
          tag.className = "tag";
          const reqAttrKey = Object.keys(perk.requires || {})[0] || "reflex";
          const reqAttrVal = Math.floor(perk.requires?.[reqAttrKey] || 0);
          tag.textContent = `Req L${Math.floor(perk.levelReq || 1)} | ${tr(`pilot.attribute.${reqAttrKey}.name`)} ${reqAttrVal}`;
          titleWrap.appendChild(name);
          titleWrap.appendChild(tag);
          head.appendChild(iconNode);
          head.appendChild(titleWrap);
          const line = document.createElement("p");
          line.className = "line";
          line.textContent = tr(`pilot.perk.${perk.id}.desc`);
          const impact = document.createElement("p");
          impact.className = "impact";
          impact.innerHTML = `<strong>Modifiers:</strong> ${formatModifierLine(perk.modifiers || {})}`;
          card.appendChild(head);
          card.appendChild(line);
          card.appendChild(impact);
          grid.appendChild(card);
        }
        section.appendChild(grid);
      };

      appendSection({
        titleKey: "help.section.combat_economy",
          cards: ["shared_pool", "drain_factors", "salvage_loop", "flight_models", "difficulty_presets", "mutator_presets"]
        });

      const weaponSection = appendSection({
        titleKey: "help.section.weapons",
        hintKey: "help.section.weapons_hint",
        hintHtml: true
      });
      const weaponCardsMount = document.createElement("div");
      weaponCardsMount.id = "weaponCards";
      weaponCardsMount.className = "grid";
      weaponSection.appendChild(weaponCardsMount);

      const missionCards = Array.from(new Set((cfg.mission?.order || []).map(toMissionCard)));
      if (!missionCards.includes("mission_mini_boss")) missionCards.push("mission_mini_boss");
      if (!missionCards.includes("boss_rush_mode")) missionCards.push("boss_rush_mode");
      appendSection({
        titleKey: "help.section.mission_types",
        hintKey: "help.section.mission_types_hint",
        hintHtml: true,
        extraHints: [{ key: "help.section.mission_endless_hint", html: true }],
        cards: missionCards
      });

      const biomes = cfg.missionDirector?.biomes || [];
      const biomeCards = [];
      for (const biome of biomes) {
        const key = biomeCardById[biome.id];
        if (key && !biomeCards.includes(key)) biomeCards.push(key);
      }
      appendSection({
        titleKey: "help.section.biomes",
        hintKey: "help.section.biomes_hint",
        cards: biomeCards
      });

      appendSection({
        titleKey: "help.section.pilot_rpg",
        cards: ["pilot_xp", "pilot_attributes", "pilot_perk_unlock"]
      });
      appendPilotAttributeReferenceSection();
      appendPilotPerkReferenceSection();

      appendSection({
        titleKey: "help.section.pilot_identity",
        hintKey: "help.section.pilot_identity_hint",
        hintHtml: true,
        cards: ["identity_pilots", "identity_references", "identity_ships"]
      });
      appendPilotRosterSection();
      appendShipFrameSection();

      const asteroidCards = ["asteroid_normal"];
      for (const type of Object.keys(asteroidTypes)) {
        if (type === "normal") continue;
        const key = `asteroid_${type}`;
        if (!asteroidCards.includes(key)) asteroidCards.push(key);
      }
      appendSection({
        titleKey: "help.section.asteroids",
        cards: asteroidCards
      });

      const ufoCards = [];
      for (const mode of Object.keys(cfg.ufo?.modeWeights || {})) {
        const key = `ufo_${mode}`;
        if (!ufoCards.includes(key)) ufoCards.push(key);
      }
      appendSection({
        titleKey: "help.section.ufo_types",
        cards: ufoCards
      });

      const hazards = [];
      for (const biome of biomes) {
        const key = hazardCardBySource[biome.hazards?.type];
        if (key && !hazards.includes(key)) hazards.push(key);
      }
      for (const modifierKey of Object.keys(cfg.missionDirector?.modifiers || {})) {
        const key = hazardCardBySource[modifierKey];
        if (key && !hazards.includes(key)) hazards.push(key);
      }
      appendSection({
        titleKey: "help.section.hazards",
        cards: hazards
      });

      appendSection({
        titleKey: "help.section.dev_profiling",
        hintKey: "help.section.dev_profiling_hint",
        hintHtml: true,
        extraHints: [{ key: "help.section.ui_shortcuts_hint", html: true }]
      });

      const previews = [];
      const slotDefs = [
        { slot: "primary", label: tr("help.weapon.slot.primary"), hotkey: "Space", action: "primary" },
        { slot: "secondary", label: tr("help.weapon.slot.secondary"), hotkey: "X", action: "secondary" },
        { slot: "utility", label: tr("help.weapon.slot.utility"), hotkey: "C", action: "utility" }
      ];

      function toFixed(value, digits = 1) {
        if (!Number.isFinite(value)) return "-";
        return Number(value).toFixed(digits);
      }

      function calcShieldDrain(action, energyCost) {
        const shared = cfg.ship.sharedPool || {};
        if (!shared.enabled) return 0;
        const factorByAction = {
          primary: shared.primaryShieldCostFactor ?? 0,
          secondary: shared.secondaryShieldCostFactor ?? 0,
          utility: shared.utilityShieldCostFactor ?? 0,
          dash: shared.dashShieldCostFactor ?? 0
        };
        return (energyCost || 0) * (factorByAction[action] || 0);
      }

      function calcRange(spec) {
        const speed = spec.projectileSpeed;
        const ttl = spec.ttlSeconds;
        if (!Number.isFinite(speed) || !Number.isFinite(ttl)) return null;
        return Math.round(speed * ttl);
      }

      function createStat(label, value) {
        const div = document.createElement("div");
        div.className = "stat";
        const key = document.createElement("b");
        key.textContent = label;
        div.appendChild(key);
        div.appendChild(document.createTextNode(` ${value}`));
        return div;
      }

      function colorForKind(kind) {
        if (kind.includes("rail")) return "rgba(228,172,255,0.95)";
        if (kind.includes("spread")) return "rgba(162,255,214,0.95)";
        if (kind.includes("chain")) return "rgba(148,226,255,0.95)";
        if (kind.includes("cluster")) return "rgba(255,202,136,0.95)";
        if (kind.includes("emp")) return "rgba(187,142,255,0.95)";
        if (kind.includes("shield")) return "rgba(132,255,194,0.95)";
        return "rgba(180,238,255,0.95)";
      }

      function drawPreview(preview, timeMs) {
        const { canvas, spec, slot } = preview;
        const ctx = canvas.getContext("2d");
        const w = canvas.width;
        const h = canvas.height;
        const t = (timeMs % 1300) / 1300;
        const pulse = 0.68 + Math.sin(timeMs / 130) * 0.24;

        ctx.clearRect(0, 0, w, h);
        const bg = ctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, "rgba(8,16,30,0.95)");
        bg.addColorStop(1, "rgba(3,8,18,0.98)");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = "rgba(102,199,255,0.32)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(10, h / 2);
        ctx.lineTo(w - 10, h / 2);
        ctx.stroke();

        const kind = spec.kind || "auto";
        const color = colorForKind(kind);
        const baseX = 24;
        const travelX = baseX + t * (w - 50);
        const count = spec.count || 1;

        if (slot === "utility") {
          const radius = kind === "pulse" ? 10 + 20 * t : kind === "emp" ? 8 + 18 * t : 10 + 8 * t;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.25 + 0.5 * (1 - t);
          ctx.beginPath();
          ctx.arc(w / 2, h / 2, radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
          if (kind === "shield") {
            ctx.fillStyle = "rgba(138,255,201,0.25)";
            ctx.beginPath();
            ctx.arc(w / 2, h / 2, 8, 0, Math.PI * 2);
            ctx.fill();
          }
          return;
        }

        for (let i = 0; i < count; i += 1) {
          const spread = spec.spread || 0;
          const rel = count === 1 ? 0 : i / (count - 1) - 0.5;
          const y = h / 2 + rel * Math.sin(spread) * 48;
          if (kind === "rail") {
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.8;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(baseX, y);
            ctx.lineTo(w - 12, y);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }

          ctx.fillStyle = color;
          ctx.shadowColor = color;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(travelX, y, Math.max(2, spec.radius || 2), 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        if (kind === "chain") {
          ctx.strokeStyle = "rgba(151,232,255,0.85)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(travelX, h / 2);
          ctx.lineTo(travelX + 15, h / 2 - 8 * pulse);
          ctx.lineTo(travelX + 28, h / 2 + 8 * pulse);
          ctx.stroke();
        }
      }

      function buildWeaponCard(slotDef, id, spec) {
        const card = document.createElement("article");
        card.className = "card weapon-card";

        const head = document.createElement("div");
        head.className = "head";
        const icon = document.createElement("div");
        icon.className = "icon";
        icon.innerHTML =
          '<svg viewBox="0 0 32 32" class="glyph"><path class="g-stroke" d="M6 16 L26 16 M18 10 L26 16 L18 22"/></svg>';
        const info = document.createElement("div");
        const name = document.createElement("p");
        name.className = "name";
        name.textContent = spec.label;
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = `${slotDef.label} | ${spec.role} | ${slotDef.hotkey}`;
        info.appendChild(name);
        info.appendChild(tag);
        head.appendChild(icon);
        head.appendChild(info);

        const desc = document.createElement("p");
        desc.className = "line";
        desc.textContent = `${spec.effectText || ""}${spec.impactText ? ` | ${spec.impactText}` : ""}`;

        const preview = document.createElement("canvas");
        preview.className = "weapon-preview";
        preview.width = 320;
        preview.height = 64;

        const stats = document.createElement("div");
        stats.className = "stats";

        const cooldown = spec.cooldownSeconds;
        const energy = spec.energyCost || 0;
        const heat = spec.heatGain || 0;
        const shieldDrain = calcShieldDrain(slotDef.action, energy);
        const count = spec.count || 1;
        const dmg = spec.bossDamage;
        const ttl = spec.ttlSeconds;
        const speed = spec.projectileSpeed;
        const range = calcRange(spec);

        stats.appendChild(createStat(tr("help.weapon.stat.id"), id));
        stats.appendChild(createStat(tr("help.weapon.stat.cooldown"), `${toFixed(cooldown, 2)}s`));
        stats.appendChild(createStat(tr("help.weapon.stat.energy"), toFixed(energy, 1)));
        stats.appendChild(createStat(tr("help.weapon.stat.shield_drain"), toFixed(shieldDrain, 1)));
        stats.appendChild(createStat(tr("help.weapon.stat.heat"), toFixed(heat, 1)));

        if (Number.isFinite(dmg)) stats.appendChild(createStat(tr("help.weapon.stat.dmg"), toFixed(dmg, 1)));
        if (count > 1) stats.appendChild(createStat(tr("help.weapon.stat.shots_per_trigger"), String(count)));
        if (count > 1 && Number.isFinite(dmg)) stats.appendChild(createStat(tr("help.weapon.stat.burst_dmg"), toFixed(dmg * count, 1)));
        if (Number.isFinite(speed)) stats.appendChild(createStat(tr("help.weapon.stat.proj_speed"), Math.round(speed).toString()));
        if (Number.isFinite(ttl)) stats.appendChild(createStat(tr("help.weapon.stat.ttl"), `${toFixed(ttl, 2)}s`));
        if (Number.isFinite(range)) stats.appendChild(createStat(tr("help.weapon.stat.range"), range.toString()));
        if (Number.isFinite(spec.radius)) stats.appendChild(createStat(tr("help.weapon.stat.radius"), toFixed(spec.radius, 1)));
        if ((spec.pierce || 0) > 0) stats.appendChild(createStat(tr("help.weapon.stat.pierce"), String(spec.pierce)));
        if ((spec.chainTargets || 0) > 0) stats.appendChild(createStat(tr("help.weapon.stat.chain_targets"), String(spec.chainTargets)));
        if ((spec.pulseRadius || 0) > 0) stats.appendChild(createStat(tr("help.weapon.stat.aoe_radius"), String(Math.round(spec.pulseRadius))));
        if ((spec.disableSeconds || 0) > 0) stats.appendChild(createStat(tr("help.weapon.stat.disable"), `${toFixed(spec.disableSeconds, 1)}s`));
        if ((spec.shieldSeconds || 0) > 0) stats.appendChild(createStat(tr("help.weapon.stat.invuln"), `${toFixed(spec.shieldSeconds, 1)}s`));

        card.appendChild(head);
        card.appendChild(desc);
        card.appendChild(preview);
        card.appendChild(stats);
        previews.push({ canvas: preview, spec, slot: slotDef.slot });
        weaponCardsMount.appendChild(card);
      }

      for (const slotDef of slotDefs) {
        const byId = cfg.loadout[slotDef.slot] || {};
        for (const id of Object.keys(byId)) buildWeaponCard(slotDef, id, byId[id]);
      }

      function animate(timeMs) {
        for (const preview of previews) drawPreview(preview, timeMs);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
